# Blueprint Render — colom-bobbiesi
# Crear desde Dashboard: New > Blueprint > conectar repo con este archivo
# O configurar manualmente los servicios según los comentarios abajo.

databases:
  - name: colom-bobbiesi-db
    plan: free
    databaseName: colom_bobbiesi
    user: colom_bobbiesi

services:
  - type: web
    name: colom-bobbiesi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: gunicorn app:app --workers 2 --threads 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: colom-bobbiesi-db
          property: connectionString
      # Completar manualmente tras crear el sitio web público:
      # - key: PUBLIC_API_KEY
      #   generateValue: true
      # - key: PUBLIC_API_CORS_ORIGIN
      #   value: https://www.tu-sitio.com.ar
      - key: PUBLIC_API_MAX_DIAS
        value: "60"
